<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Self Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow">
        <h1 class="font-bold text-sm">Dashboard Admin Studio</h1>
        <a href="index.html" class="bg-white/10 px-3 py-1.5 rounded-lg text-xs font-semibold">Kembali ke Booking</a>
    </header>

    <!-- Form Login Admin -->
    <div id="loginCard" class="max-w-md mx-auto my-auto p-4 w-full">
        <div class="bg-white p-6 rounded-2xl shadow-xl border">
            <h3 class="font-bold text-lg mb-4 text-center">Login Khusus Admin</h3>
            <form onsubmit="loginAdmin(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold mb-1">Email</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border rounded-xl text-xs" placeholder="ridwanfadhil19996@gmail.com">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Password</label>
                    <input type="password" id="pass" required class="w-full px-3 py-2 border rounded-xl text-xs" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold shadow">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Tabel Data Admin (Muncul Setelah Login) -->
    <div id="adminPanel" class="hidden max-w-5xl mx-auto p-4 my-6 w-full flex-1">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-extrabold text-lg">Daftar Riwayat Pesanan Masuk</h2>
            <button onclick="logoutAdmin()" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-xl text-xs font-bold">Logout</button>
        </div>
        <div class="bg-white rounded-2xl shadow border overflow-x-auto">
            <table class="w-full text-left text-xs">
                <tr class="bg-slate-50 border-b font-bold text-slate-700">
                    <th class="p-3">Antrean</th>
                    <th class="p-3">Nama</th>
                    <th class="p-3">WhatsApp</th>
                    <th class="p-3">Paket</th>
                    <th class="p-3">Status</th>
                    <th class="p-3">Bukti</th>
                    <th class="p-3 text-center">Aksi</th>
                </tr>
                <tbody id="tableBody" class="divide-y"></tbody>
            </table>
        </div>
    </div>

    <footer class="bg-white border-t p-4 text-center text-xs text-slate-500">
        &copy; 2026 STAI Al-Anwar Sarang
    </footer>

    <!-- Script Admin -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // GANTI DENGAN FIREBASE CONFIG ANDA
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_ANDA",
            authDomain: "proyek.firebaseapp.com",
            projectId: "proyek-id",
            storageBucket: "proyek.appspot.com",
            messagingSenderId: "123",
            appId: "1:123:web:abc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allOrders = [];

        window.loginAdmin = (e) => {
            e.preventDefault();
            const em = document.getElementById('email').value.trim();
            const pw = document.getElementById('pass').value.trim();
            if (em === 'ridwanfadhil19996@gmail.com' && pw === '@291199rf') {
                localStorage.setItem('is_admin', 'true');
                showDashboard();
            } else {
                alert('Email atau Password salah!');
            }
        };

        window.logoutAdmin = () => {
            localStorage.removeItem('is_admin');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        };

        function showDashboard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            onSnapshot(collection(db, "studio_orders"), (snapshot) => {
                allOrders = [];
                snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));
                renderTable();
            });
        }

        if (localStorage.getItem('is_admin') === 'true') {
            showDashboard();
        }

        function renderTable() {
            const tb = document.getElementById('tableBody');
            tb.innerHTML = '';
            allOrders.forEach(o => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-bold text-emerald-700">No. ${o.antrean}</td>
                    <td class="p-3 font-semibold">${o.nama}</td>
                    <td class="p-3"><a href="https://wa.me/${o.wa}" target="_blank" class="text-blue-600 underline">${o.wa}</a></td>
                    <td class="p-3">${o.paket}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded font-bold ${o.status === 'Lunas' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status}</span></td>
                    <td class="p-3">${o.bukti ? `<a href="${o.bukti}" target="_blank" class="text-emerald-700 underline font-bold">Lihat</a>` : '-'}</td>
                    <td class="p-3 text-center">
                        <button onclick="hapusPesanan('${o.id}')" class="bg-red-50 text-red-600 p-1.5 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tb.appendChild(tr);
            });
        }

        window.hapusPesanan = async (id) => {
            if (confirm('Yakin ingin menghapus pesanan ini? Antrean akan terbuka kembali.')) {
                await deleteDoc(doc(db, "studio_orders", id));
                alert('Berhasil dihapus.');
            }
        };
    </script>
</body>
</html>
